<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{devLogin.title}">Вход</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}" th:text="#{app.name}">Product HUB</a>
</header>
<main class="content narrow">
    <h1 th:text="#{devLogin.title}">Вход</h1>
    <p class="muted" th:text="#{devLogin.text}">Выберите пользователя</p>
    <table class="table">
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.fullName}">Имя</td>
            <td class="muted">
                <span th:each="r, s : ${u.roles}" th:text="#{'role.' + ${r}} + (${s.last} ? '' : ', ')">Роль</span>
            </td>
            <td class="right">
                <form th:action="@{/dev/login-as}" method="post">
                    <input type="hidden" name="login" th:value="${u.username}">
                    <button type="submit" th:text="#{devLogin.enter}">Войти</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
