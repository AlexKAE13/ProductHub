<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{upload.title}">Загрузка файлов</title>
</head>
<body>
<main class="content">
    <h1 th:text="#{upload.title}">Загрузка файлов</h1>
    <p class="warn" th:if="${planExpired != null}" th:text="#{validation.plan.expired}">План устарел</p>
    <p class="muted" th:text="#{upload.hint}"></p>
    <form th:action="@{/artifacts/upload}" method="post" enctype="multipart/form-data" id="upload-form">
        <div id="dropzone" class="dropzone">
            <p th:text="#{upload.drop}">Перетащите файлы сюда или выберите</p>
            <input type="file" name="files" id="upload-input" multiple required>
            <ul id="upload-list" class="muted"></ul>
        </div>
        <span class="error" th:if="${errors != null and errors.containsKey('files')}" th:text="#{${errors['files']}}"></span>
        <div class="form-actions">
            <button type="submit" class="primary" th:text="#{upload.next}">Далее: метаданные</button>
            <a class="btn" th:href="@{/artifacts}" th:text="#{common.cancel}">Отмена</a>
        </div>
    </form>
    <script th:src="@{/js/upload.js}" defer></script>
</main>
</body>
</html>
