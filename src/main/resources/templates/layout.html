<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)" th:with="look=${@currentSettings.get().look()}"
      th:attr="data-ui=${look.modern} ? 'modern' : 'classic',data-mode=${#strings.toLowerCase(look.mode.name())},data-theme=${look.mode.name() == 'DARK'} ? 'dark' : 'light',data-palette=${look.palette.css()},data-bgtype=${look.background.css()}"
      th:style="${look.modern} ? '--wall:url(' + ${look.wallpaperUrl()} + ');--wall-blur:' + ${look.blur} + 'px;--dim:' + ${look.dim / 100.0}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName}">
    <title th:replace="${title}">Product HUB</title>
    <script th:if="${look.modern && look.mode.name() == 'AUTO'}">
        // Системная тема подставляется до первой отрисовки, чтобы страница не мигала
        if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:if="${look.modern}" th:href="@{/css/modern.css}">
    <script th:src="@{/vendor/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/filters.js}" defer></script>
    <script th:src="@{/js/layout.js}" defer></script>
    <script th:src="@{/js/search.js}" defer></script>
    <script th:src="@{/js/feedback.js}" defer></script>
    <script th:src="@{/js/skeleton.js}" defer></script>
    <script th:src="@{/js/nav.js}" defer></script>
    <script th:src="@{/js/suggest.js}" defer></script>
    <script th:src="@{/js/sku-edit.js}" defer></script>
    <script th:src="@{/js/qa.js}" defer></script>
    <script th:src="@{/js/modern.js}" th:if="${look.modern}" defer></script>
    <script th:src="@{/js/controls.js}" th:if="${look.modern}" defer></script>
</head>
<body th:class="${@currentSettings.get().bodyClasses()}" th:attr="data-view=${pageView},data-route=${pageRoute}">
<script>(function () { var b = document.body; if (b.classList.contains('layout-side') && window.innerWidth < 1100 && !b.classList.contains('sidebar-collapsed')) { b.classList.add('sidebar-collapsed'); b.dataset.autoCollapsed = '1'; } })();</script>
<div id="bg" th:if="${look.modern}" aria-hidden="true"><div class="layer"></div><div class="tint"></div><div class="grain"></div></div>

<!-- Определения фрагментов (на странице не выводятся) -->
<div th:remove="all">
<!-- Меню: одно описание для верхней панели и для сайдбара -->
<nav class="menu" th:fragment="menu" sec:authorize="isAuthenticated()">
        <span class="nav-label" th:text="#{menu.group.knowledge}" sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')">x</span>
        <a th:href="@{/catalog}" th:title="#{menu.catalog}" th:classappend="${activeMenu == 'catalog'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')"><svg class="ico catalog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span class="label" th:text="#{menu.catalog}">catalog</span></a>
        <a th:href="@{/artifacts}" th:title="#{menu.artifacts}" th:classappend="${activeMenu == 'artifacts'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')"><svg class="ico artifacts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><polyline points="14 2 14 7 19 7"/></svg><span class="label" th:text="#{menu.artifacts}">artifacts</span></a>
        <a th:href="@{/firmware}" th:title="#{menu.firmware}" th:classappend="${activeMenu == 'firmware'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')"><svg class="ico firmware" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M19 9h3M19 14h3M2 9h3M2 14h3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg><span class="label" th:text="#{menu.firmware}">firmware</span></a>
        <a th:href="@{/cases}" th:title="#{menu.cases}" th:classappend="${activeMenu == 'cases'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')"><svg class="ico cases" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><span class="label" th:text="#{menu.cases}">cases</span></a>
        <span class="nav-label" th:text="#{menu.group.work}" sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')">x</span>
        <a th:href="@{/tasks}" th:title="#{menu.tasks}" th:classappend="${activeMenu == 'tasks'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')"><svg class="ico tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16.5 9"/></svg><span class="label" th:text="#{menu.tasks}">tasks</span><span class="badge" th:if="${@taskCounter.count() > 0}" th:text="${@taskCounter.count()}" th:title="#{tasks.newCount}">1</span></a>
        <a th:href="@{/dashboard}" th:title="#{menu.dashboard}" th:classappend="${activeMenu == 'dashboard'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','HEAD','ADMIN')"><svg class="ico dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="10"/></svg><span class="label" th:text="#{menu.dashboard}">dashboard</span></a>
        <span class="nav-label" th:text="#{menu.group.system}" sec:authorize="hasAnyRole('PRODUCT','ADMIN')">x</span>
        <a th:href="@{/directories}" th:title="#{menu.directories}" th:classappend="${activeMenu == 'directories'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','ADMIN')"><svg class="ico directories" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="label" th:text="#{menu.directories}">directories</span></a>
        <a th:href="@{/feedback}" th:title="#{menu.feedback}" th:classappend="${activeMenu == 'feedback'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','ADMIN')"><svg class="ico feedback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="label" th:text="#{menu.feedback}">feedback</span></a>
        <a th:href="@{/settings}" th:title="#{menu.settings}" th:classappend="${activeMenu == 'settings'} ? 'active'"
           sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')"><svg class="ico settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span class="label" th:text="#{menu.settings}">settings</span></a>
    </nav>


<!-- Переключатель светлой и темной темы (только современное оформление) -->
<button type="button" class="theme-toggle" th:fragment="theme-toggle" th:if="${look.modern}" sec:authorize="isAuthenticated()" id="themeToggle"
        th:attr="data-l-light=#{theme.light},data-l-dark=#{theme.dark}" th:title="#{theme.toggle}" th:aria-label="#{theme.toggle}">
    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span class="label theme-label">Тема</span>
</button>

<!-- Строка поиска в шапке: результаты приходят по мере ввода (HTMX), от двух символов -->
<div class="hub-search" th:fragment="search-box" sec:authorize="isAuthenticated()">
    <form th:action="@{/search}" method="get" role="search">
        <input type="search" name="q" class="hub-search-input" autocomplete="off" th:placeholder="#{search.placeholder}"
               th:aria-label="#{search.placeholder}"
               hx-get="/search/suggest" hx-trigger="input changed delay:150ms, search" hx-target="next .hub-search-drop" hx-swap="innerHTML">
        <div class="hub-search-drop" hidden></div>
    </form>
</div>

<!-- Переключатель пользователя (только dev) или имя пользователя -->
<div class="user" th:fragment="user-area" sec:authorize="isAuthenticated()">
    <form th:if="${@environment.matchesProfiles('dev')}" th:action="@{/dev/login-as}" method="post" class="switcher"
          th:title="#{header.loginAs}">
        <span class="dev-tag">dev</span>
        <select name="login" onchange="this.form.submit()" th:aria-label="#{header.loginAs}">
            <option th:each="u : ${@devUsers.all()}" th:value="${u.username}" th:text="${u.fullName}"
                    th:selected="${u.username == #authentication.name}">Пользователь
            </option>
        </select>
        <noscript>
            <button type="submit" th:text="#{header.switch}">Переключить</button>
        </noscript>
    </form>
    <span class="user-name" th:unless="${@environment.matchesProfiles('dev')}" th:text="${#authentication.principal.fullName}">Пользователь</span>
    <form th:if="${@environment.getProperty('producthub.ldap.enabled') == 'true'}" th:action="@{/logout}" method="post" class="inline">
        <button type="submit" class="link" th:text="#{login.logout.button}">Выйти</button>
    </form>
</div>
</div>

<div class="app" th:with="cfg=${@currentSettings.get()}">
    <aside class="sidebar" th:if="${cfg.side}" sec:authorize="isAuthenticated()">
        <div class="sidebar-head">
            <a class="brand" th:href="@{/}" th:title="#{app.name}"><span class="brand-mark">P</span><span class="brand-text" th:text="#{app.name}">Product HUB</span></a>

        </div>
        <nav class="menu" th:replace="~{:: menu}"></nav>
        <div class="sidebar-foot">
            <div class="me" sec:authorize="isAuthenticated()" th:with="u=${#authentication.principal}">
                <span class="av" th:attr="data-name=${u.fullName}" aria-hidden="true">&nbsp;</span>
                <div><b th:text="${u.fullName}">Имя</b><small th:text="#{'role.' + ${u.roles.iterator().next()}}">Роль</small></div>
            </div>
            <div th:replace="~{:: user-area}"></div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" th:title="#{sidebar.toggle}" th:aria-label="#{sidebar.toggle}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            <span class="label" th:text="#{sidebar.collapse}">Свернуть</span>
        </button>
        <button type="button" class="theme-toggle" th:replace="~{:: theme-toggle}"></button>
    </aside>

    <div class="app-main">
        <header class="topbar" th:unless="${cfg.side}">
            <a class="brand" th:href="@{/}" th:text="#{app.name}">Product HUB</a>
            <nav class="menu" th:replace="~{:: menu}"></nav>
            <div class="hub-search" th:replace="~{:: search-box}"></div>
            <div class="user" th:replace="~{:: user-area}"></div>
            <button type="button" class="theme-toggle" th:replace="~{:: theme-toggle}"></button>
        </header>

        <div class="searchbar" th:if="${cfg.side}" sec:authorize="isAuthenticated()"><div class="hub-search" th:replace="~{:: search-box}"></div></div>

        <main class="content" th:replace="${content}">
            <p>Содержимое страницы</p>
        </main>

        <footer class="footer">
            <span th:text="#{footer.responseTime(${@requestTiming.elapsedMs()})}">Время ответа: 0 мс</span>
            <span th:if="${@environment.matchesProfiles('dev')}" th:text="#{footer.devProfile}">профиль dev</span>
        </footer>
    </div>
</div>
<!-- Комментарии к интерфейсу: кнопка и панель рисуются скриптом feedback.js, подписи берутся отсюда -->
<div id="hub-feedback" sec:authorize="hasAnyRole('PRODUCT','SERVICE_CENTER','SALES','RND','HEAD','ADMIN')" hidden
     th:attr="data-can-manage=${#authorization.expression('hasAnyRole(''PRODUCT'',''ADMIN'')')},data-l-resolve=#{feedback.resolve},data-l-reopen=#{feedback.reopen},data-l-button=#{feedback.button},data-l-title=#{feedback.title},data-l-pick=#{feedback.pick},data-l-page=#{feedback.page},
              data-l-send=#{feedback.send},data-l-cancel=#{feedback.cancel},data-l-reply=#{feedback.reply},data-l-placeholder=#{feedback.placeholder},
              data-l-reply-placeholder=#{feedback.replyPlaceholder},data-l-empty=#{feedback.empty},data-l-notfound=#{feedback.notFound},
              data-l-hint=#{feedback.hint},data-l-whole=#{feedback.whole},data-l-error=#{feedback.error},data-l-close=#{feedback.close},
              data-l-kind-BUG=#{feedback.kind.BUG},data-l-kind-IDEA=#{feedback.kind.IDEA},data-l-kind-QUESTION=#{feedback.kind.QUESTION},
              data-l-status-NEW=#{feedback.status.NEW},data-l-status-ACCEPTED=#{feedback.status.ACCEPTED},
              data-l-status-REJECTED=#{feedback.status.REJECTED},data-l-status-DONE=#{feedback.status.DONE}"></div>
</body>
</html>
