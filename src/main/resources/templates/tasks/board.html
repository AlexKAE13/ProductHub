<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="#{menu.tasks}">Задачи</title>
</head>
<body>
<main class="content wide">
    <div class="page-head">
        <h1 th:text="#{menu.tasks}">Задачи</h1>
        <div class="actions">
            <a class="btn primary" th:if="${canCreate}" th:href="@{/tasks/new}" th:text="#{tasks.create}">Создать задачу</a>
        </div>
    </div>
    <nav class="tabs">
        <a class="active" th:href="@{/tasks}" th:text="#{tasks.tab.board}">Доска</a>
        <a th:href="@{/questions/my}" th:text="#{qa.my.title}">Мои вопросы</a>
    </nav>

    <form id="filters" class="filters" th:action="@{/tasks}" method="get"
          hx-get="/tasks" hx-target="#board" hx-push-url="true" hx-swap="outerHTML" hx-trigger="change, submit">
        <select name="assignee" data-plain th:if="${board.canSeeAll()}" th:aria-label="#{tasks.filter.assignee}">
            <option value="me" th:selected="${filter.assignee == null or filter.assignee == 'me'}" th:text="#{tasks.filter.mine}">Мои</option>
            <option value="all" th:selected="${filter.assignee == 'all'}" th:text="#{tasks.filter.all}">Все</option>
            <option th:each="u : ${assignees}" th:value="${u.id}" th:text="${u.fullName}" th:selected="${#strings.equals(filter.assignee, u.id.toString())}"></option>
        </select>
        <select name="type" th:classappend="${filter.type != null and !filter.type.isEmpty()} ? 'on'" th:aria-label="#{tasks.filter.type}">
            <option value="" hidden th:text="#{tasks.filter.type}">Тип</option>
            <option th:each="t : ${types}" th:value="${t}" th:text="#{'taskType.' + ${t}}" th:selected="${t.name() == filter.type}"></option>
        </select>
        <input type="text" name="sku" th:value="${filter.sku}" data-suggest="sku" data-single autocomplete="off" placeholder="SKU" style="width:150px" th:aria-label="SKU">
        <select name="line" th:classappend="${filter.line != null} ? 'on'" th:aria-label="#{catalog.filter.line}">
            <option value="" hidden th:text="#{catalog.filter.line}">Линейка</option>
            <option th:each="l : ${lines}" th:value="${l.id}" th:text="${l.code}" th:selected="${l.id == filter.line}"></option>
        </select>
        <noscript><button type="submit" th:text="#{common.show}">Показать</button></noscript>
    </form>

    <p class="error" id="board-message" hidden></p>

    <div id="board" class="kanban" th:fragment="board">
        <div class="column" th:each="s : ${statuses}" th:classappend="'col-' + ${s}">
            <div class="column-head">
                <span th:text="#{'taskStatus.' + ${s}}">Новые</span>
                <span class="count" th:text="${board.columns().get(s).size()}">0</span>
            </div>
            <div class="cards" th:attr="data-status=${s}">
                <div class="task-card" th:each="t : ${board.columns().get(s)}"
                     th:classappend="${movable.contains(t.id)} ? 'movable'" th:attr="data-id=${t.id}">
                    <a class="task-title" th:href="@{/tasks/{id}(id=${t.id})}" th:text="${t.title}">Название</a>
                    <div class="task-meta">
                        <span class="tag" th:text="#{'taskType.' + ${t.type}}">Тип</span>
                        <span class="tag overdue-tag" th:if="${t.isOverdue(today)}" th:text="#{tasks.overdue}">просрочено</span>
                        <span class="tag prio-high" th:if="${t.priority.name() == 'HIGH'}" th:text="#{'taskPriority.' + ${t.priority}}">Высокий</span>
                    </div>
                    <div class="small" th:if="${t.relatedUrl != null}"><a th:href="${t.relatedUrl}" th:text="${t.relatedLabel}">объект</a></div>
                    <div class="small muted task-foot">
                        <span th:if="${t.dueDate != null}" th:text="#{tasks.due(${#temporals.format(t.dueDate, 'dd.MM')})}">срок</span>
                        <span th:if="${board.canSeeAll()}" th:text="${t.assignee.fullName}">исполнитель</span>
                        <span class="av" th:attr="data-name=${t.assignee.fullName}" th:title="${t.assignee.fullName}" aria-hidden="true">&nbsp;</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/vendor/Sortable.min.js}" defer></script>
    <script th:src="@{/js/kanban.js}" defer></script>
</main>
</body>
</html>
